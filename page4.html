<div class="container" id="enroll_banner">
    <p class="fw-bold display-3">OBMC Enrolement Form</p>

<br>

<div class="container form-container shadow">
    <h1>Student Information</h1>
    <br>
    <form>
        <div class="row">
            <div class="col">
                <label for="fname" class="form-label">Firstname:</label>
                <br>
                <input type="text" name="fname" class="form-control" placeholder="Enter here" required></input>
            </div>

            <div class="col">
                <label for="lname" class="form-label">Lastname:</label>
                <br>
                <input type="text" name="lname" class="form-control" placeholder="Enter here" required></input>
            </div>
        </div>
          
        <div class="row"></div>  
        <br>

        <div class="row">
            <div class="col">
                <label for="birth" class="form-label">Date of birth:</label>
                <br>
                <input type="date" name="birth" class="form-control" required></input>
            </div>

            <div class="col">
                <label for="Gender" class="form-label">Gender</label>
                <br>
                <select name="gender" class="form-control" required>
                    <option value="" disabled selected>Select...</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>
        </div>

        <br>

        <div class="row">
            <div class="col">
                <label class="form-label">Student Address:</label>
                <br>
                <input type="text" name="address" class="form-control" placeholder="Full Address" required></input>
            </div>
        </div>

        <br>

        <div class="row">
            <div class="col">
                <label class="form-label">Contact Number:</label>
                <br>
                <input type="text" name="s_num" class="form-control" placeholder="+63" required></input>
            </div>
            <div class="col">
                <label class="form-label">Email Address:</label>
                <br>
                <input type="text" name="s_email" class="form-control" placeholder="@example.com" required></input>
            </div>
        </div>

        <br><br>
        <h1>Parent/Guardian Information</h1>
        <br>

        <div class="row">
            <div class="col">
                <label for="p_name" class="form-label">Full Name</label>
                <br>
                <input type="text" name="p_name" class="form-control" placeholder="Enter here" required></input>
            </div>
        </div>

        <div class="row"></div>
        <br>

        <div class="row">
            <div class="col">
                <label class="form-label">Relationship</label>
                <br>
                <input type="text" name="rel" class="form-control" placeholder="Ex. Mother/Father/Guardian" required></input>
            </div>
            <div class="col">
                <label class="form-label">Contact Number</label>
                <br>
                <input type="text" name="p_num" class="form-control" placeholder="+63" required></input>
            </div>
            <div class="col">
                <label class="form-label">Email Address</label>
                <br>
                <input type="text" name="p_email" class="form-control" placeholder="@example.com" required></input>
            </div>
        </div>

        <br><br>
        <h1>Academic Information</h1>
        <br>

        <div class="row">
            <div class="col">
                <label for="grade" class="form-label">Grade Level</label>
                <select name="grade" class="form-control" required>
                    <option value="" disabled selected>Select...</option>
                    <option value="Casa">Casa</option>
                    <option value="Advance Casa">Advance Casa</option>
                    <option value="Grade 1">Grade 1</option>
                    <option value="Grade 2">Grade 2</option>
                    <option value="Grade 3">Grade 3</option>
                    <option value="Grade 4">Grade 4</option>
                    <option value="Grade 5">Grade 5</option>
                    <option value="Grade 6">Grade 6</option>
                    <option value="Grade 7">Grade 7</option>
                    <option value="Grade 8">Grade 8</option>
                    <option value="Grade 9">Grade 9</option>
                    <option value="Grade 10">Grade 10</option>
                    <option value="Grade 11">Grade 11</option>
                    <option value="Grade 12">Grade 12</option>
                </select>
            </div>
            <div class="col">
                <label class="form-label">Previous School</label>
                <br>
                <input type="text" name="prev_sch" class="form-control" placeholder="Previous School Name"></input>
            </div>
        </div>

        <br><br>
        <h1>Other Information</h1>
        <br>

        <div class="row">
            <div class="col">
                <label class="form-label">Mode of learning</label>
                <br>
                <input type="radio" name="mode" value="online"> Online learning
                <br>
                <input type="radio" name="mode" value="f2f"> Face to face learning
                <br><br>
                <input type="checkbox" id="Design" name="Design" required>
                <label for="Design">The information i provided is true.</label>
            </div>        
        </div>

        <br><br>
        <div class="row">
            <div class="col">
                <div class="sign-here"></div>
                <label><b>Applicant Signature</b></label>
            </div>
            <div class="col text-end">
                <img src="https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/8b5611eb-ff3a-407f-9adc-e116a23373fc/OBMC+LOGO+2024-04.png" style="width: 170px;">
                <p><b>OB Montessori Center</b><br>est. 1966</p>
            </div>
        </div>

        <br><br>

        <center>
        <div class="row">
            <div class="col">
                <label class="form-label">Please expect a reply in 3 workings days.</label>
         </center>    
         <br><br>
                
        <center>
            <button type="submit" class="btn btn-primary btn-lg px-5">Submit Form</button>
        </center>
        <br>

    </form>
</div>
